services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: klausurplaner
      POSTGRES_USER: klausurplaner
      POSTGRES_PASSWORD: geheim
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U klausurplaner"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    profiles: ["app"]
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/klausurplaner
    depends_on:
      db:
        condition: service_healthy